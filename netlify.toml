# =========================================================
# netlify.toml · Instrucciones para Netlify
# =========================================================

# Cómo construir la web
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Todas las rutas (/admin, /producto/...) las maneja React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------
# CABECERAS DE SEGURIDAD (chequeo 9)
# Si cambias de proyecto Supabase, cambia la dirección
# "tqoszpranaegbojcsxsk.supabase.co" en connect-src e img-src.
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # De dónde se puede cargar cada cosa. Todo lo demás se bloquea.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://tqoszpranaegbojcsxsk.supabase.co; connect-src 'self' https://tqoszpranaegbojcsxsk.supabase.co wss://tqoszpranaegbojcsxsk.supabase.co; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Nadie puede meter nuestra web dentro de un marco (evita engaños)
    X-Frame-Options = "DENY"
    # El navegador no adivina tipos de archivo
    X-Content-Type-Options = "nosniff"
    # Al salir a otra web, solo se comparte el nombre del sitio
    Referrer-Policy = "strict-origin-when-cross-origin"
    # La web no pide cámara, micrófono ni ubicación
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Siempre https (conexión segura) durante 2 años
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# El panel de administración no se guarda en caché ni lo indexan los buscadores
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Los archivos con huella (assets) se guardan en caché 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
